<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omreis – kies je kaart</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
  :root{--bg:#F3EFFF;--ink:#1A1238;--muted:#6A6387;--accent:#5B2EFF;--lime:#C8F53C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 "Manrope",system-ui,sans-serif;padding:24px 16px 48px}
  header{max-width:1180px;margin:0 auto 20px}
  h1{font-size:1.7rem;font-weight:800;letter-spacing:-.025em;margin:0 0 4px}
  p{margin:0;color:var(--muted)}
  .grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(43,26,102,.1);border:3px solid transparent}
  .card.chosen{border-color:var(--accent)}
  .map{height:360px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
  .foot strong{display:block;font-weight:800;font-size:1.05rem}
  .foot small{color:var(--muted)}
  button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:10px 18px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
  .chosen button{background:var(--lime);color:var(--ink)}
  .back{display:inline-block;margin-top:14px;color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Kies je kaart</h1>
  <p>Acht stijlen met dezelfde route en dezelfde bussen. Je keuze wordt direct in de app gebruikt.</p>
  <a class="back" href="./">← Terug naar de app</a>
</header>
<div class="grid" id="grid"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="mapstyles.js"></script>
<script>
  const KEY = 'omreis.map2';
  let chosen = null; try { chosen = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const route = [[4.4817,52.1663],[4.4840,52.1640],[4.4872,52.1612],[4.4901,52.1590],[4.4935,52.1581],[4.4978,52.1569]];
  const walk = [[4.4978,52.1569],[4.4995,52.1560]];
  const veh = [[4.4872,52.1612,'22','#50AF46'],[4.4790,52.1700,'IC','#2B1A66'],[4.4925,52.1648,'4','#5B2EFF']];
  const fc = f => ({ type: 'FeatureCollection', features: f });
  Object.entries(window.OMREIS_MAPS).forEach(([key, def]) => {
    const card = document.createElement('div');
    card.className = 'card' + (key === chosen ? ' chosen' : '');
    card.innerHTML = `<div class="map"></div><div class="foot"><div><strong>${def.label}</strong><small>${def.note}</small></div><button>${key === chosen ? 'Gekozen' : 'Kies deze'}</button></div>`;
    document.getElementById('grid').appendChild(card);
    card.querySelector('button').onclick = () => { localStorage.setItem(KEY, JSON.stringify(key)); location.reload(); };
    const map = new maplibregl.Map({ container: card.querySelector('.map'), style: def.style, center: [4.489, 52.160], zoom: def.pitch ? 14.6 : 13.4, pitch: def.pitch || 0, bearing: def.pitch ? -18 : 0, attributionControl: false });
    map.addControl(new maplibregl.AttributionControl({ compact: true }));
    map.on('load', () => {
      window.OMREIS_MAP_NL(map); if (def.tweak) def.tweak(map);
      card.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
      map.addSource('r', { type: 'geojson', data: fc([{ type: 'Feature', properties: { k: 't' }, geometry: { type: 'LineString', coordinates: route } }, { type: 'Feature', properties: { k: 'w' }, geometry: { type: 'LineString', coordinates: walk } }]) });
      const round = { 'line-cap': 'round', 'line-join': 'round' };
      map.addLayer({ id: 'rc', type: 'line', source: 'r', filter: ['==', ['get', 'k'], 't'], layout: round, paint: { 'line-color': '#fff', 'line-width': 9 } });
      map.addLayer({ id: 'rl', type: 'line', source: 'r', filter: ['==', ['get', 'k'], 't'], layout: round, paint: { 'line-color': '#5B2EFF', 'line-width': 5.5 } });
      map.addLayer({ id: 'rw', type: 'line', source: 'r', filter: ['==', ['get', 'k'], 'w'], layout: round, paint: { 'line-color': '#2B1A66', 'line-width': 4, 'line-dasharray': [0.1, 2] } });
      map.addSource('p', { type: 'geojson', data: fc([{ type: 'Feature', properties: { c: '#2B1A66', f: '#fff' }, geometry: { type: 'Point', coordinates: route[0] } }, { type: 'Feature', properties: { c: '#5B2EFF', f: '#C8F53C' }, geometry: { type: 'Point', coordinates: walk[1] } }]) });
      map.addLayer({ id: 'pp', type: 'circle', source: 'p', paint: { 'circle-radius': 8, 'circle-color': ['get', 'f'], 'circle-stroke-color': ['get', 'c'], 'circle-stroke-width': 3.5 } });
      map.addSource('v', { type: 'geojson', data: fc(veh.map(v => ({ type: 'Feature', properties: { n: v[2], c: v[3] }, geometry: { type: 'Point', coordinates: [v[0], v[1]] } }))) });
      map.addLayer({ id: 'vc', type: 'circle', source: 'v', paint: { 'circle-radius': 11, 'circle-color': ['get', 'c'], 'circle-stroke-color': '#fff', 'circle-stroke-width': 2.5 } });
      map.addLayer({ id: 'vt', type: 'symbol', source: 'v', layout: { 'text-field': ['get', 'n'], 'text-size': 10, 'text-font': ['Noto Sans Bold'], 'text-allow-overlap': true }, paint: { 'text-color': '#fff' } });
    });
  });
</script>
</body>
</html>
